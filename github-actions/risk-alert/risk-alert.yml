name: Risk Alert System

on:
  schedule:
    # Run daily at 9 AM UTC (adjust to your timezone)
    - cron: '0 9 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - '.github/scripts/risk_alert.py'

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  risk-check:
    runs-on: ubuntu-latest
    name: Check for High-Risk Issues

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub requests

      - name: Run Risk Alert Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python .github/scripts/risk_alert.py

      - name: Upload Risk Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-report
          path: risk_report.json
          retention-days: 30
