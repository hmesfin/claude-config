name: Smart Code Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          pip install ruff mypy black isort
        continue-on-error: true

      - name: Install Node dependencies
        run: |
          npm install -g eslint @typescript-eslint/parser @typescript-eslint/eslint-plugin
        continue-on-error: true

      - name: Get PR diff
        id: pr-diff
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr_diff.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run static analysis
        id: static-analysis
        run: |
          python .github/scripts/smart_code_review.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Post review comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let reviewBody;

            try {
              const review = JSON.parse(fs.readFileSync('review_report.json', 'utf8'));
              reviewBody = review.comment;
            } catch (error) {
              reviewBody = '⚠️ Could not generate code review';
            }

            // Find existing review comment
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const reviewBotComment = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes('Smart Code Review')
            );

            if (reviewBotComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: reviewBotComment.id,
                body: reviewBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: reviewBody
              });
            }

      - name: Auto-approve if clean
        if: steps.static-analysis.outputs.approved == 'true'
        run: |
          gh pr review ${{ github.event.pull_request.number }} --approve --body "✅ Auto-approved: All checks passed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
